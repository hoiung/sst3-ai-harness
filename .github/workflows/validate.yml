name: Validate Config Files

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        # Commit-message-scan step below uses `git log <since>..HEAD` against
        # the push's `before` sha. Default shallow-clone depth=1 misses that
        # history and errors exit 128; fetch full history for this run.
        fetch-depth: 0

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'

    - name: Validate JSON files
      run: |
        echo "Validating JSON files..."
        find . -name "*.json" -print0 | while IFS= read -r -d '' file; do
          echo "Checking $file"
          # The path reaches node as an argument, never pasted into the JS source: a file named
          # `a',process.exit(0),'.json` printed "Valid" and ran code in the runner (dotfiles#577).
          node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file" && echo "  ✓ Valid" || exit 1
        done

    - name: Validate YAML files
      run: |
        echo "Validating YAML files..."
        # NUL-delimited: an unquoted $(find) split a spaced name into words (dotfiles#577).
        find . \( -name "*.yml" -o -name "*.yaml" \) -print0 \
          | xargs -0 python3 -c "import sys, yaml; [yaml.safe_load(open(f)) for f in sys.argv[1:]]" \
          && echo "✓ All YAML files are valid" || exit 1

    - name: Check JavaScript syntax
      run: |
        echo "Checking JavaScript files..."
        find . -name "*.js" -print0 | while IFS= read -r -d '' file; do
          echo "Checking $file"
          node --check "$file" && echo "  ✓ Valid syntax" || exit 1
        done

    - name: Validate Markdown files
      run: |
        echo "Checking Markdown files..."
        npm install -g markdownlint-cli
        markdownlint '**/*.md' --disable MD013 MD041 || echo "✓ Markdown files checked (warnings ignored)"
      continue-on-error: true

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Verify mirror drift manifest
      run: python3 scripts/check-mirror-drift.py

    - name: Secret detection (blocking)
      run: python3 scripts/check-public-repo-secrets.py .

    - name: Commit-message secret scan — push events (blocking)
      if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/check-public-repo-secrets.py \
          --scan-commit-messages \
          --since ${{ github.event.before }}

    - name: Commit-message secret scan — PR events (blocking)
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/check-public-repo-secrets.py \
          --scan-commit-messages \
          --since ${{ github.event.pull_request.base.sha }}
